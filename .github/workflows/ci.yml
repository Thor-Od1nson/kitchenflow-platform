name: KitchenFlow CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: API build
        run: npm run build --workspace=@kitchenflow/api

      - name: Web build
        run: npm run build --workspace=@kitchenflow/web