apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchenflow-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kitchenflow-web
  template:
    metadata:
      labels:
        app: kitchenflow-web
    spec:
      containers:
        - name: web
          image: kitchenflow/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.kitchenflow.example/v1"
